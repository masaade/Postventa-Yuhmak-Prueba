services:
  - type: web
    name: yuhmak-postventa-055
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_render.sh
    healthCheckPath: /_stcore/health
    disk:
      name: yuhmak-private-data
      mountPath: /var/data/yuhmak
      sizeGB: 1
    envVars:
      - key: YUHMAK_DATA_DIR
        value: /var/data/yuhmak
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
